<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Observabilidade - Core Finance</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f5f5f5; }
  </style>
</head>
<body>
  <h1>Eventos de Webhook</h1>
  <p>Fonte: tabela em memoria (Etapa 2 inicial).</p>
  <table id="events">
    <thead><tr><th>ID</th><th>Recebido em</th><th>Tipo</th><th>Codigo</th></tr></thead>
    <tbody></tbody>
  </table>
  <script>
    fetch('/webhooks/events').then(r => r.json()).then(data => {
      const tbody = document.querySelector('#events tbody');
      for (const [id, ev] of data.events) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${id}</td><td>${ev.receivedAt}</td><td>${ev.body.webhook_type || '-'}</td><td>${ev.body.webhook_code || '-'}</td>`;
        tbody.appendChild(tr);
      }
    });
  </script>
</body>
</html>
